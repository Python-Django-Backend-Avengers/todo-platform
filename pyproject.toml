[project]
name = "todo-platform"
version = "0.1.0"
description = "Production-grade evolving TODO platform focused on modular architecture, typed Python, observability, CQRS, streaming systems, and distributed engineering."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.5",
    "djangorestframework>=3.17.1",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
]


[dependency-groups]
dev = [
    "django-stubs>=6.0.4",
    "mypy>=2.1.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "ruff>=0.15.13",
]


[tool.ruff]
line-length = 100
target-version = "py314"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "Q"
]


ignore = [
    "E501",
]


[tool.ruff.lint.per-file-ignores]
"src/backend/config/settings/*.py" = ["F403", "F405"]


[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true


[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"


[tool.mypy]
python_version = "3.14"

mypy_path = [
    "src/backend"
]

strict = true

warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true

disallow_untyped_defs = true
disallow_incomplete_defs = true

check_untyped_defs = true

no_implicit_optional = true

plugins = ["mypy_django_plugin.main"]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"

pythonpath = [
    "src/backend",
]

python_files = [
    "test_*.py",
    "*_test.py",
]

testpaths = [
    "src/backend/tests",
]


[tool.django-stubs]
django_settings_module = "config.settings.local"
